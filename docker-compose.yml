# API + worker de coleta + raspador do Google Maps (gosom).
#   cp .env.example .env   (e preencha)
#   docker compose up --build
# API:   http://localhost:8000/docs
# gosom: http://localhost:8080
services:
  gosom:
    image: gosom/google-maps-scraper
    command: ["-data-folder", "/gmapsdata", "-c", "2"]
    environment:
      - DISABLE_TELEMETRY=1
    ports:
      - "8080:8080"
    volumes:
      - ./gmapsdata:/gmapsdata
      - gmaps-playwright-cache:/opt

  coletor:
    build: ./services/coletor
    env_file: .env
    environment:
      - PV_GOSOM_URL=http://gosom:8080
      - PV_DB=/dados/desvio.db
    ports:
      - "8000:8000"
    volumes:
      - ./dados:/dados
    depends_on:
      - gosom

  worker:
    build: ./services/coletor
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      - PV_GOSOM_URL=http://gosom:8080
      - PV_DB=/dados/desvio.db
    volumes:
      - ./dados:/dados
    depends_on:
      - gosom

volumes:
  gmaps-playwright-cache:
