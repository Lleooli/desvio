# API + worker de coleta. O Google Maps vem de uma de duas fontes (services/coletor/app/gmaps.py):
#   - Places API oficial (produção): PV_GOOGLE_PLACES_KEY no .env; o gosom não sobe.
#   - gosom, o raspador (só desenvolvimento): perfil "gosom".
#
#   cp .env.example .env   (e preencha, inclusive PV_DATABASE_URL do Supabase)
#   docker compose up --build                  # desenvolvimento: o .env de exemplo tem COMPOSE_PROFILES=gosom
#   docker compose --profile gosom up --build  # o mesmo, explícito
#   Produção: .env sem COMPOSE_PROFILES e com PV_GOOGLE_PLACES_KEY; `docker compose up --build`
#   sobe só a API e o worker.
# Postgres local só para os testes:  docker compose --profile teste up -d banco-teste
# API:   http://localhost:8000/docs
# gosom: http://localhost:8080
services:
  gosom:
    image: gosom/google-maps-scraper
    profiles: ["gosom"]
    command: ["-data-folder", "/gmapsdata", "-c", "2"]
    environment:
      - DISABLE_TELEMETRY=1
    ports:
      - "8080:8080"
    volumes:
      - ./gmapsdata:/gmapsdata
      - gmaps-playwright-cache:/opt

  coletor:
    build: ./services/coletor
    restart: unless-stopped
    env_file: .env
    environment:
      - PV_GOSOM_URL=http://gosom:8080
    ports:
      - "8000:8000"
    depends_on:
      gosom:
        condition: service_started
        required: false  # sem o perfil "gosom", sobe sem ele

  worker:
    build: ./services/coletor
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      - PV_GOSOM_URL=http://gosom:8080
    depends_on:
      gosom:
        condition: service_started
        required: false

  # Postgres vazio só para o pytest (os testes rodam as migrações e o auth de mentira de infra/supabase/local):
  # PV_TEST_DATABASE_URL=postgresql://postgres:teste@localhost:54329/desvio_teste
  banco-teste:
    image: postgres:16
    profiles: ["teste"]
    environment:
      - POSTGRES_PASSWORD=teste
      - POSTGRES_DB=desvio_teste
    ports:
      - "54329:5432"

volumes:
  gmaps-playwright-cache:
