<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div id="root" ></div>
<script>
  var D = window.Desvio, h = React.createElement;
  function Demo() {
    var s = React.useState('Toque numa ação'), msg = s[0], set = s[1];
    return h('div', null,
      h(D.SwipeActions, { onPasso: function () { set('Passo: lugar descartado'); }, onFavorito: function () { set('Favorito: entra no roteiro e sobe na prioridade'); }, onBora: function () { set('Bora: lugar entra no roteiro'); } }),
      h('p', { style: { textAlign: 'center', margin: 0, font: '400 14px/20px var(--font-sans)', color: 'var(--ink-muted)' }, 'aria-live': 'polite' }, msg));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
