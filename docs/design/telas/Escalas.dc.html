<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escalas e dias</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/desvio/tokens.css">
<link rel="stylesheet" href="ds/desvio/components/bundle.css">
<script src="ds/desvio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--placa)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans);">
  <div style="padding: 36px 16px 0; display: flex; flex-direction: column; gap: 16px;">
    <a href="NovaViagem.dc.html" aria-label="Voltar" style="display: inline-grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 999px; color: var(--ink);"><x-import component-from-global-scope="Desvio.Icon" name="x" size="{{n22}}"></x-import></a>
    <p style="margin: 0; font-family: var(--font-placa); font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">De avião · passo 2 de 2</p>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 36px; line-height: 37px; font-weight: 700; letter-spacing: -0.035em;">Onde você vai <x-import component-from-global-scope="Desvio.Destaque">parar</x-import>?</h1>
    <x-import component-from-global-scope="Desvio.TextField" label="Saindo de" icon="plane" default-value="São Paulo, SP"></x-import>
  </div>
  <div style="display: flex; gap: 12px; overflow-x: auto; padding: 20px 16px 8px;">
    <sc-for list="{{cidades}}" as="c" hint-placeholder-count="2">
      <x-import component-from-global-scope="Desvio.JanelaCidade" cidade="{{c.cidade}}" uf="{{c.uf}}" dias="{{c.dias}}" variante="{{c.variante}}" selecionada="{{c.selecionada}}" on-click="{{c.escolher}}"></x-import>
    </sc-for>
    <button type="button" class="dv-btn dv-btn--secondary" style="flex: none; align-self: flex-start; margin-top: 64px; padding: 0 18px;">
      <x-import component-from-global-scope="Desvio.Icon" name="plane"></x-import>
      Escala
    </button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0;">
    <span style="font-size: 15px; line-height: 20px; font-weight: 600;">Quantos dias em {{atual}}?</span>
    <x-import component-from-global-scope="Desvio.Segmented" block="{{yes}}" rotulo="Dias na cidade" opcoes="{{dias}}" valor="{{diasAtual}}" on-change="{{mudarDias}}"></x-import>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 32px;">
    <a class="dv-btn dv-btn--primary dv-btn--block" href="Carregando.dc.html" style="text-decoration: none;">Buscar lugares</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { atual: 'Salvador', dias: { 'Salvador': 3, 'Vitória da Conquista': 2 } };
  }
  renderVals() {
    const s = this.state;
    const base = [
      { cidade: 'Salvador', uf: 'BA', variante: 'placa' },
      { cidade: 'Vitória da Conquista', uf: 'BA', variante: 'faixa' }
    ];
    const diasAtual = String(s.dias[s.atual]);
    return {
      yes: true,
      n22: 22,
      atual: s.atual,
      diasAtual: diasAtual === '5' ? '5' : diasAtual,
      dias: [{ valor: '1', label: '1 dia' }, { valor: '2', label: '2' }, { valor: '3', label: '3' }, { valor: '5', label: '5+' }],
      mudarDias: (v) => this.setState({ dias: Object.assign({}, s.dias, { [s.atual]: Number(v) }) }),
      cidades: base.map((c) => Object.assign({}, c, {
        dias: s.dias[c.cidade],
        selecionada: s.atual === c.cidade,
        escolher: () => this.setState({ atual: c.cidade })
      }))
    };
  }
}
</script>
</body>
</html>
