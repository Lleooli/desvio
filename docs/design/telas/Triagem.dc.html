<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Triagem com IA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/desvio/tokens.css">
<link rel="stylesheet" href="ds/desvio/components/bundle.css">
<script src="ds/desvio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--placa)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans);">
  <div style="padding: 44px 16px 12px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-100);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: var(--font-placa); font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Conhecendo você · {{progressoTexto}}</span>
      <a href="Viagens.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none;">Pular</a>
    </div>
    <div role="progressbar" aria-label="Progresso das perguntas" aria-valuemin="0" aria-valuemax="5" aria-valuenow="{{passo}}" style="height: 8px; border-radius: 999px; background: var(--surface-300); overflow: hidden;">
      <div style="height: 100%; border-radius: 999px; background: var(--placa); width: {{progresso}};"></div>
    </div>
  </div>
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{mensagens}}" as="m" hint-placeholder-count="3">
      <div style="{{m.linha}}">
        <sc-if value="{{m.ia}}" hint-placeholder-val="{{true}}">
          <span style="display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 999px; background: var(--placa); color: var(--on-placa); font-family: var(--font-placa); font-weight: 700; font-size: 15px;">IA</span>
        </sc-if>
        <div style="{{m.bolha}}">{{m.texto}}</div>
      </div>
    </sc-for>
  </div>
  <div style="padding: 12px 16px 28px; background: var(--surface-200); box-shadow: var(--shadow-sheet); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-if value="{{temOpcoes}}" hint-placeholder-val="{{true}}">
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">{{dica}}</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{opcoes}}" as="o" hint-placeholder-count="4">
          <x-import component-from-global-scope="Desvio.Chip" label="{{o.label}}" icon="{{o.icon}}" selected="{{o.selected}}" on-click="{{o.toggle}}"></x-import>
        </sc-for>
      </div>
      <sc-if value="{{multi}}" hint-placeholder-val="{{true}}">
        <button type="button" class="dv-btn dv-btn--primary dv-btn--block" disabled="{{semEscolha}}" onClick="{{confirmar}}">Continuar</button>
      </sc-if>
    </sc-if>
    <sc-if value="{{textoLivre}}" hint-placeholder-val="{{false}}">
      <x-import component-from-global-scope="Desvio.TextField" label="Escreva do seu jeito" placeholder="Ex.: sempre paro para tomar café" default-value="Café coado na beira da estrada e lugares com sombra para o cachorro"></x-import>
      <button type="button" class="dv-btn dv-btn--primary dv-btn--block" onClick="{{enviar}}">Enviar</button>
    </sc-if>
    <sc-if value="{{fim}}" hint-placeholder-val="{{false}}">
      <a class="dv-btn dv-btn--primary dv-btn--block" href="NovaViagem.dc.html">Planejar minha primeira viagem</a>
      <a class="dv-btn dv-btn--ghost dv-btn--block" href="Perfil.dc.html">Ver o que a IA entendeu</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.perguntas = [
      { texto: 'Oi! Antes da primeira viagem, quero entender seu jeito de viajar. Numa viagem de carro, o que faz você parar?', multi: true, dica: 'Escolha quantas quiser.',
        opcoes: [{ label: 'Mirantes e natureza', icon: 'leaf' }, { label: 'Comida da região', icon: 'food' }, { label: 'Cidades históricas', icon: 'camera' }, { label: 'Só o essencial', icon: 'fuel' }] },
      { texto: 'Boa! Com quem você costuma viajar?', multi: false, dica: 'Toque em uma opção.',
        opcoes: [{ label: 'Sozinho', icon: 'user' }, { label: 'Casal', icon: 'user' }, { label: 'Família com crianças', icon: 'user' }, { label: 'Amigos', icon: 'user' }, { label: 'Com pet', icon: 'leaf' }] },
      { texto: 'Você marcou comida da região, então vou caprichar nisso. Na estrada, o que costuma pedir?', multi: true, dica: 'A IA adaptou esta pergunta à sua resposta anterior.',
        opcoes: [{ label: 'Churrasco e buffet', icon: 'food' }, { label: 'Comida caseira', icon: 'food' }, { label: 'Lanche rápido', icon: 'food' }, { label: 'Café e doces', icon: 'food' }] },
      { texto: 'E quanto você gosta de gastar nas paradas?', multi: false, dica: 'Toque em uma opção.',
        opcoes: [{ label: 'Econômico', icon: 'fuel' }, { label: 'Equilibrado', icon: 'star' }, { label: 'Sem economizar', icon: 'star' }] },
      { texto: 'Última: tem alguma coisa que não pode faltar numa viagem sua?', livre: true }
    ];
    this.state = {
      passo: 1,
      respostas: ['Mirantes e natureza, Comida da região'],
      sel: {},
      fim: false
    };
  }
  avancar(resposta) {
    const s = this.state;
    const respostas = s.respostas.concat([resposta]);
    const passo = s.passo + 1;
    this.setState({ respostas: respostas, passo: passo, sel: {}, fim: passo >= this.perguntas.length });
  }
  renderVals() {
    const s = this.state;
    const linhaIA = 'display: flex; gap: 8px; align-items: flex-end; max-width: 92%;';
    const linhaEu = 'display: flex; justify-content: flex-end; margin-left: auto; max-width: 85%;';
    const bolhaIA = 'padding: 12px 14px; background: var(--surface-200); border-radius: 18px 18px 18px 6px; font-size: 16px; line-height: 23px; box-shadow: var(--shadow-1);';
    const bolhaEu = 'padding: 10px 14px; background: var(--ink); color: var(--surface-100); border-radius: 18px 18px 6px 18px; font-size: 16px; line-height: 23px; font-weight: 500;';
    const msgs = [];
    for (let i = 0; i <= Math.min(s.passo, this.perguntas.length - 1); i++) {
      msgs.push({ ia: true, texto: this.perguntas[i].texto, linha: linhaIA, bolha: bolhaIA });
      if (i < s.respostas.length) msgs.push({ ia: false, texto: s.respostas[i], linha: linhaEu, bolha: bolhaEu });
    }
    if (s.fim) {
      const r = s.respostas.map((x) => String(x).toLowerCase());
      msgs.push({ ia: true, texto: 'Pronto! Vou priorizar paradas com ' + r[0] + ', pensando em quem viaja com você (' + r[1] + '), e um orçamento ' + (r[3] || 'equilibrado') + '. Dá para ajustar isso quando quiser no seu perfil.', linha: linhaIA, bolha: bolhaIA });
    }
    const atual = this.perguntas[Math.min(s.passo, this.perguntas.length - 1)];
    const opcoes = (atual.opcoes || []).map((o) => Object.assign({}, o, {
      selected: !!s.sel[o.label],
      toggle: () => {
        if (atual.multi) {
          this.setState({ sel: Object.assign({}, s.sel, { [o.label]: !s.sel[o.label] }) });
        } else {
          this.avancar(o.label);
        }
      }
    }));
    const escolhidos = Object.keys(s.sel).filter((k) => s.sel[k]);
    const respondidas = Math.min(s.respostas.length, 5);
    return {
      passo: respondidas,
      progresso: (respondidas / 5 * 100) + '%',
      progressoTexto: s.fim ? 'pronto' : (respondidas + 1) + ' de 5',
      mensagens: msgs,
      temOpcoes: !s.fim && !atual.livre,
      textoLivre: !s.fim && !!atual.livre,
      fim: s.fim,
      dica: atual.dica || '',
      multi: !!atual.multi,
      opcoes: opcoes,
      semEscolha: escolhidos.length === 0,
      confirmar: () => this.avancar(escolhidos.join(', ')),
      enviar: () => this.avancar('Café coado na beira da estrada e lugares com sombra para o cachorro')
    };
  }
}
</script>
</body>
</html>
