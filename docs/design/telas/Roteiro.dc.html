<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Roteiro</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/desvio/tokens.css">
<link rel="stylesheet" href="ds/desvio/components/bundle.css">
<script src="ds/desvio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--placa)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="Desvio.Ceu" serra="{{yes}}" style="flex: none;">
    <p style="margin: 8px 0 0; font-family: var(--font-placa); font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">KM 2.731 · 3 dias · 8 lugares</p>
    <h1 style="margin: 6px 0 0; font-family: var(--font-display); font-size: 36px; line-height: 37px; font-weight: 700; letter-spacing: -0.035em;">Seu roteiro está <x-import component-from-global-scope="Desvio.Destaque">pronto</x-import></h1>
    <div style="height: 104px; margin: 0 -16px -16px; overflow: hidden;">
      <div style="margin-top: -40px;">
        <x-import component-from-global-scope="Desvio.Estrada" cidades="{{cidades}}" variante="curva" largura="{{n40}}"></x-import>
      </div>
    </div>
  </x-import>
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 168px; display: flex; flex-direction: column; gap: 10px;">
    <p style="margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 26px; font-weight: 650; letter-spacing: -0.02em;">Dia 1 · Alegrete → Curitiba</p>
    <sc-for list="{{dia1}}" as="p" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 12px; background: var(--surface-200); border-radius: 16px;">
        <span style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: var(--asfalto); color: var(--on-asfalto); font-family: var(--font-placa); font-size: 17px; font-weight: 700;">{{p.ordem}}</span>
        <span style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-weight: 600; font-size: 16px; line-height: 22px;">{{p.nome}}</span>
          <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">{{p.quando}}</span>
        </span>
        <span style="font-family: var(--font-placa); font-size: 17px; letter-spacing: 0.02em; color: var(--ink-muted); white-space: nowrap;">{{p.km}}</span>
      </div>
    </sc-for>
    <p style="margin: 8px 0 0; font-family: var(--font-display); font-size: 22px; line-height: 26px; font-weight: 650; letter-spacing: -0.02em;">Dia 2 · Curitiba → Montes Claros</p>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 64px; padding: 12px 16px 16px; background: var(--surface-100); display: flex; gap: 12px;">
    <a class="dv-btn dv-btn--secondary" href="Paradas.dc.html" style="flex: 1 1 0;">Editar</a>
    <a class="dv-btn dv-btn--primary" href="https://www.google.com/maps" style="flex: 2 1 0;"><x-import component-from-global-scope="Desvio.Icon" name="route"></x-import>Abrir no mapa</a>
  </div>
  <nav class="dv-nav" aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0;">
    <a class="dv-nav__item" href="Viagens.dc.html" style="text-decoration: none;"><span class="dv-nav__pill"><x-import component-from-global-scope="Desvio.Icon" name="suitcase" size="{{n22}}"></x-import></span>Viagens</a>
    <a class="dv-nav__item" href="Paradas.dc.html" style="text-decoration: none;"><span class="dv-nav__pill"><x-import component-from-global-scope="Desvio.Icon" name="compass" size="{{n22}}"></x-import></span>Descobrir</a>
    <a class="dv-nav__item" href="Roteiro.dc.html" aria-current="page" style="text-decoration: none;"><span class="dv-nav__pill"><x-import component-from-global-scope="Desvio.Icon" name="route" size="{{n22}}"></x-import></span>Roteiro</a>
    <a class="dv-nav__item" href="Perfil.dc.html" style="text-decoration: none;"><span class="dv-nav__pill"><x-import component-from-global-scope="Desvio.Icon" name="user" size="{{n22}}"></x-import></span>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, n22: 22, n40: 40,
      cidades: ['Alegrete', 'Lages', 'Curitiba', 'Belo Horizonte', 'Montes Claros', 'Vitória da Conquista'],
      dia1: [
        { ordem: 1, nome: 'Posto Coxilha', quando: 'Lages · café, ~6h30 de estrada', km: 'KM 505' },
        { ordem: 2, nome: 'Churrascaria Gaúcha', quando: 'Lages · almoço, ~7h', km: 'KM 512' },
        { ordem: 3, nome: 'Mirante da Serra', quando: 'Curitiba · pôr do sol, ~9h30', km: 'KM 722' },
        { ordem: 4, nome: 'Cantina do Nono', quando: 'Curitiba · jantar e pernoite', km: 'KM 719' }
      ]
    };
  }
}
</script>
</body>
</html>
