name: deploy

# Sobe a API na VPS depois do merge na main. Não roda em pull request.
# Enquanto o segredo VPS_HOST não existir (ainda sem VPS), o passo é pulado e o check fica verde.
on:
  push:
    branches: [main]
    paths:
      - "services/coletor/**"
      - "docker-compose.prod.yml"
      - "infra/caddy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
    steps:
      - name: Sem VPS configurada
        if: env.VPS_HOST == ''
        run: echo "Segredo VPS_HOST ausente; deploy pulado (docs/deploy.md)."

      # Sem a impressão digital, o ssh-action aceita qualquer chave de host.
      - name: Exigir a impressão digital da VPS
        if: env.VPS_HOST != '' && env.VPS_FINGERPRINT == ''
        run: |
          echo "Defina o segredo VPS_FINGERPRINT (docs/deploy.md)."
          exit 1

      - name: Atualizar o stack na VPS
        if: env.VPS_HOST != ''
        # appleboy/ssh-action v1.2.2, fixado pelo commit porque recebe a chave privada
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /srv/desvio
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
